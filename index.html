<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>生存状況予測</title>
  </head>
  <body>
    <h1>生存状況予測</h1>
    <form id="form">
      <label for="sex">性別:</label>
      <input type="number" id="sex" name="sex" placeholder="0.5以下なら男性、それ以上なら女性" required><br><br>

      <label for="age">年齢:</label>
      <input type="number" id="age" name="age" min="0" max="100" step="1" required><br><br>

      <label for="pclass">客室等級:</label>
      <select id="pclass" name="pclass">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option> 
      </select><br><br>

      <button type="submit">予測</button>
    </form>

    <div id="result"></div>

    <script src="script.js"></script>
  </body>
</html>
