<!DOCTYPE html>
<html>
<head>
  <title>生存状況予測</title>
</head>
<body>
  <h1>生存状況予測</h1>
  <form id="form">
    <label for="sex">性別:</label><br>
    <select name="sex" id="sex">
      <option value="0">男性</option>
      <option value="1">女性</option>
    </select><br><br>
    <label for="pclass">客室等級:</label><br>
    <input type="number" name="pclass" id="pclass" min="1" max="3"><br><br>
    <button type="button" onclick="predict()">生存状況を予測</button>
  </form>
  <h2>結果</h2>
  <div id="result"></div>

  <script src="script.js"></script> 
</body>
</html>
