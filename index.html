<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生存状況予測アプリ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    label, button {
      display: block;
      margin: 10px 0;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>生存状況予測アプリ</h1>

  <!-- 性別の入力 -->
  <label for="sex">性別 (0: 女性, 1: 男性):</label>
  <input type="number" id="sex" min="0" max="1" step="0.1" placeholder="0 または 1を入力してください">

  <!-- 客室等級の入力 -->
  <label for="pclass">客室の等級 (1〜3):</label>
  <input type="number" id="pclass" min="1" max="3" step="1" placeholder="1, 2, 3を入力してください">

  <!-- 生存状況を予測するボタン -->
  <button onclick="predictSurvival()">生存状況を予測</button>

  <!-- 結果を表示するエリア -->
  <div id="result"></div>

  <script>
    // 決定木アルゴリズム
    function Survival(pclass, sex) {
      if (sex <= 0.5) {  // 性別が女性の場合
        if (pclass <= 2.5) {  // 客室等級が1または2の場合
          return 1;  // 生存
        } else {
          return 0;  // 死亡
        }
      } else {  // 性別が男性の場合
        return 0;  // 死亡
      }
    }

    // 生存状況を予測する関数
    function predictSurvival() {
      // 性別と客室等級の入力値を取得
      const sex = parseFloat(document.getElementById('sex').value);
      const pclass = parseFloat(document.getElementById('pclass').value);

      // 入力値のバリデーション
      if (isNaN(sex) || (sex !== 0 && sex !== 1)) {
        alert("性別は0または1を入力してください。");
        return;
      }
      if (isNaN(pclass) || pclass < 1 || pclass > 3) {
        alert("客室の等級は1から3の整数を入力してください。");
        return;
      }

      // 決定木アルゴリズムを使って生存状況を予測
      const result = Survival(pclass, sex);

      // 結果を表示
      const resultText = result === 1 ? "生存" : "死亡";
      document.getElementById('result').innerText = `予測結果: ${resultText}`;
    }
  </script>
</body>
</html>
