<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生存状況予測アプリ</title>
  <!-- Bootstrap CSSの読み込み -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet">
  <style>
    body {
      padding: 20px;
      background-color: #f8f9fa;
    }
    .result {
      margin-top: 20px;
      font-size: 1.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center mb-4">生存状況予測アプリ</h1>

    <!-- 性別の入力 -->
    <div class="mb-3">
      <label for="sex" class="form-label">性別 (0: 男性, 1: 女性):</label>
      <input 
        type="number" 
        id="sex" 
        class="form-control" 
        placeholder="0 または 1を入力してください"
        min="0" 
        max="1" 
        step="0.1">
    </div>

    <!-- 客室等級の入力 -->
    <div class="mb-3">
      <label for="pclass" class="form-label">客室の等級 (1〜3):</label>
      <input 
        type="number" 
        id="pclass" 
        class="form-control" 
        placeholder="1, 2, 3を入力してください" 
        min="1" 
        max="3" 
        step="1">
    </div>

    <!-- 生存状況を予測するボタン -->
    <div class="d-grid">
      <button 
        class="btn btn-primary btn-lg" 
        onclick="predictSurvival()">生存状況を予測</button>
    </div>

    <!-- 結果を表示するエリア -->
    <div id="result" class="result text-center mt-4"></div>
  </div>

  <!-- Bootstrap JavaScriptの読み込み -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 決定木アルゴリズム
    function Survival(pclass, sex) {
      if (sex <= 0.5) {  // 性別が男性の場合
        if (pclass <= 2.5) {  // 客室等級が1または2の場合
          return 1;  // 生存
        } else {
          return 0;  // 死亡
        }
      } else {  // 性別が女性の場合
        return 0;  // 死亡
      }
    }

    // 生存状況を予測する関数
    function predictSurvival() {
      // 性別と客室等級の入力値を取得
      const sex = parseFloat(document.getElementById('sex').value);
      const pclass = parseFloat(document.getElementById('pclass').value);

      // 入力値のバリデーション
      if (isNaN(sex) || (sex !== 0 && sex !== 1)) {
        alert("性別は0または1を入力してください。");
        return;
      }
      if (isNaN(pclass) || pclass < 1 || pclass > 3) {
        alert("客室の等級は1から3の整数を入力してください。");
        return;
      }

      // 決定木アルゴリズムを使って生存状況を予測
      const result = Survival(pclass, sex);

      // 結果を表示
      const resultText = result === 1 ? "生存" : "死亡";
      const resultDiv = document.getElementById('result');
      resultDiv.innerText = `予測結果: ${resultText}`;
      resultDiv.classList.remove('text-success', 'text-danger');

      // 結果に応じた色を設定
      if (result === 1) {
        resultDiv.classList.add('text-success'); // 緑色
      } else {
        resultDiv.classList.add('text-danger'); // 赤色
      }
    }
  </script>
</body>
</html>
